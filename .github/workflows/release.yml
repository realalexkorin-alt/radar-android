name: Signed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (bump versionCode and versionName in app/build.gradle first)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RADAR_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/radar-release.p12"
      - name: Verify and build
        env:
          RADAR_KEYSTORE: ${{ runner.temp }}/radar-release.p12
          RADAR_STORE_PASSWORD: ${{ secrets.RADAR_STORE_PASSWORD }}
          RADAR_KEY_ALIAS: radar
          RADAR_KEY_PASSWORD: ${{ secrets.RADAR_STORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk radar.apk
          sha256sum radar.apk > SHA256SUMS
          gh release create "$RELEASE_TAG" radar.apk SHA256SUMS --draft --title "$RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/radar-release.p12"
