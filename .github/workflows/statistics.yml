name: Statistics collection
on:
  push:
    branches: ['codex/statistics']
  workflow_dispatch:
concurrency:
  group: radar-statistics-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  logo:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --ignore-scripts && node --test test/statistics.test.js
        working-directory: backend
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest --tests dev.raf.radar.ObservationQueueTest
      - run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statistics-${{ matrix.api }}
          path: |
            app/build/outputs/apk/release/*.apk
            logo-smoke.txt
            screens/
            apksigner.jar
