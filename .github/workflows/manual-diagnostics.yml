name: Manual diagnostics verification
on:
  pull_request:
    branches: [main]
  push:
    branches: ['codex/manual-diagnostics-046']
    paths: ['app/build.gradle']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleRelease :app:lintDebug
      - run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: manual-diagnostics-release
          path: |
            app/build/outputs/apk/release/*.apk
            apksigner.jar
