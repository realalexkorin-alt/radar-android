name: Android checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Relevant Economy regression or complete legacy suite'
        type: choice
        options: [economy, full]
        default: economy
concurrency:
  group: radar-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --tests dev.raf.radar.PriceLevelTest --tests dev.raf.radar.TariffSelectionTest --tests dev.raf.radar.WidgetGestureTest --tests dev.raf.radar.PollPlannerTest --tests dev.raf.radar.AlertPolicyTest --tests dev.raf.radar.UpdateCatalogTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: radar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: radar-release-unsigned
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  emulator:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            profile: Nexus One
          - api: 35
            profile: pixel_7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew assembleDebug assembleDebugAndroidTest
            git fetch --depth=1 origin tag v0.1.5-alpha
            git worktree add --detach "$RUNNER_TEMP/radar-baseline" v0.1.5-alpha
            ./gradlew -p "$RUNNER_TEMP/radar-baseline" assembleDebug
            adb install -r "$RUNNER_TEMP/radar-baseline/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class 'dev.raf.radar.UpgradeStateTest#seedBaseline' dev.raf.radar.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-seed.txt
            grep -q 'OK (1 test)' upgrade-seed.txt || exit 1
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am instrument -w -r -e class 'dev.raf.radar.UpgradeStateTest#verifyCandidatePreservedData' dev.raf.radar.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-verify.txt
            grep -q 'OK (1 test)' upgrade-verify.txt || exit 1
            adb shell pm clear dev.raf.radar
            adb shell am instrument -w -r -e class dev.raf.radar.AccessEntryTest dev.raf.radar.test/androidx.test.runner.AndroidJUnitRunner | tee permission-entry.txt
            grep -q 'OK (1 test)' permission-entry.txt || { adb pull /sdcard/Pictures/RadarSmoke ./screens || true; adb logcat -d -v brief > emulator-logcat.txt; adb shell uiautomator dump /sdcard/permission.xml; adb pull /sdcard/permission.xml ./permission.xml; exit 1; }
            adb shell pm grant dev.raf.radar android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant dev.raf.radar android.permission.ACCESS_FINE_LOCATION
            if [ ${{ matrix.api }} -ge 33 ]; then adb shell pm grant dev.raf.radar android.permission.POST_NOTIFICATIONS; fi
            adb shell appops set dev.raf.radar SYSTEM_ALERT_WINDOW allow
            adb shell appops set dev.raf.radar REQUEST_INSTALL_PACKAGES allow
            if [ "${{ inputs.suite }}" = "full" ]; then adb shell am instrument -w -r -e notClass dev.raf.radar.AccessEntryTest,dev.raf.radar.UpgradeStateTest dev.raf.radar.test/androidx.test.runner.AndroidJUnitRunner | tee ordinary-tests.txt; else adb shell am instrument -w -r -e class dev.raf.radar.EconomyPatchTest,dev.raf.radar.UpdateArchiveTest,dev.raf.radar.StartupSoundTest dev.raf.radar.test/androidx.test.runner.AndroidJUnitRunner | tee ordinary-tests.txt; fi
            grep -Eq '^OK \([0-9]+ tests?\)' ordinary-tests.txt || { adb pull /sdcard/Pictures/RadarSmoke ./screens || true; adb logcat -d -s AndroidRuntime TestRunner ActivityManager PackageParser PackageManager ApkSignatureVerifier; exit 1; }
            adb pull /sdcard/Pictures/RadarSmoke ./screens || true
            adb logcat -d -v brief > emulator-logcat.txt
            mkdir -p upgrade-fixtures
            ./gradlew :app:assembleDebug -PradarVersionCode=16
            cp app/build/outputs/apk/debug/app-debug.apk upgrade-fixtures/upgrade.apk
            adb shell am force-stop dev.raf.radar
            adb install -r upgradecheck/build/outputs/apk/debug/upgradecheck-debug.apk
            python3 scripts/prepare-upgrade-check.py
            adb push upgrade-fixtures/upgrade.apk /data/local/tmp/radar-upgrade.apk
            adb push upgrade-fixtures/radar.xml /data/local/tmp/radar-upgrade-prefs.xml
            adb shell run-as dev.raf.radar mkdir -p cache/updates shared_prefs
            adb shell run-as dev.raf.radar cp /data/local/tmp/radar-upgrade.apk cache/updates/radar.apk
            adb shell run-as dev.raf.radar cp /data/local/tmp/radar-upgrade-prefs.xml shared_prefs/radar.xml
            adb shell am instrument -w dev.raf.radar.upgradecheck/.UpgradeDriver | tee system-upgrade.txt
            grep -q 'OK (1 upgrade)' system-upgrade.txt || { adb logcat -d -s AndroidRuntime ActivityManager; exit 1; }
            adb shell run-as dev.raf.radar cat shared_prefs/radar.xml > upgrade-fixtures/after.xml
            python3 scripts/prepare-upgrade-check.py --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            screens/
            permission-entry.txt
            permission.xml
            ordinary-tests.txt
            emulator-logcat.txt
            upgrade-seed.txt
            upgrade-verify.txt
            system-upgrade.txt
