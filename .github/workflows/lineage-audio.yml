name: Lineage 2 audio release
on:
  push:
    branches: ['codex/lineage-audio']
  workflow_dispatch:
concurrency:
  group: radar-lineage-audio-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  logo:
    environment: release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.RADAR_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/radar-release.p12"
      - env:
          RADAR_KEYSTORE: ${{ runner.temp }}/radar-release.p12
          RADAR_STORE_PASSWORD: ${{ secrets.RADAR_STORE_PASSWORD }}
          RADAR_KEY_ALIAS: radar
          RADAR_KEY_PASSWORD: ${{ secrets.RADAR_STORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          profile: pixel_7
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant dev.raf.radar android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant dev.raf.radar android.permission.ACCESS_FINE_LOCATION
            if [ ${{ matrix.api }} -ge 33 ]; then adb shell pm grant dev.raf.radar android.permission.POST_NOTIFICATIONS; fi
            adb shell appops set dev.raf.radar SYSTEM_ALERT_WINDOW allow
            adb shell appops set dev.raf.radar REQUEST_INSTALL_PACKAGES allow
            adb shell am force-stop com.android.launcher3 || true
            adb shell am instrument -w -r -e class dev.raf.radar.AppearanceTest dev.raf.radar.test/androidx.test.runner.AndroidJUnitRunner | tee logo-smoke.txt
            adb pull /sdcard/Pictures/RadarSmoke ./screens || true
            grep -q 'OK (2 tests)' logo-smoke.txt
      - run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lineage-theme-${{ matrix.api }}
          path: |
            app/build/outputs/apk/release/*.apk
            logo-smoke.txt
            screens/
            apksigner.jar
      - name: Publish verified patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk radar.apk
          sha256sum radar.apk > SHA256SUMS
          gh release create v0.1.40-alpha radar.apk SHA256SUMS --target "$GITHUB_SHA" --title "0.1.40-alpha" --notes "Lineage 2: звуки запуска, мониторинга, вкладок, меню и обновления. Отдельный выключатель звука; стандартная тема сохраняет прежние звуки."
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/radar-release.p12"
