name: Daily point history verification
on:
  push:
    branches: ['codex/day-history-063']
    paths: ['app/build.gradle']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts && node --test test/*.test.js
        working-directory: backend
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --tests dev.raf.radar.PointHistoryCacheTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | grep "versionCode='63' versionName='0.1.63-alpha'"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          profile: pixel_2
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell appops set dev.raf.radar REQUEST_INSTALL_PACKAGES allow
            adb shell am instrument -w -r -e class dev.raf.radar.PointHistoryUiTest dev.raf.radar.test/androidx.test.runner.AndroidJUnitRunner | tee yandex-ui.txt
            adb pull /sdcard/Pictures/RadarSmoke ./screens || true
            grep -q 'OK (4 tests)' yandex-ui.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day-history-release
          path: |
            app/build/outputs/apk/release/*.apk
            yandex-ui.txt
            screens/
            apksigner.jar
