plugins { id 'com.android.application' }
android {
 namespace 'dev.raf.radar'
 compileSdk 35
 defaultConfig { applicationId 'dev.raf.radar'; minSdk 28; targetSdk 35; versionCode 4; versionName '0.1.3-alpha'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 buildFeatures { buildConfig true }
 signingConfigs {
  release { if (System.getenv('RADAR_KEYSTORE')) { storeFile file(System.getenv('RADAR_KEYSTORE')); storePassword System.getenv('RADAR_STORE_PASSWORD'); keyAlias System.getenv('RADAR_KEY_ALIAS'); keyPassword System.getenv('RADAR_KEY_PASSWORD') } }
 }
 buildTypes { release { if (System.getenv('RADAR_KEYSTORE')) signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'org.maplibre.gl:android-sdk:11.8.0'
 implementation 'androidx.core:core:1.13.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:core:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
